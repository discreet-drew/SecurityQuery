[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secquery"
version = "0.1.0"
description = "Evidence-grounded cybersecurity document intelligence assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SecQuery contributors" }]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501"]